services:
  redis:
    image: redis:7-alpine
    container_name: ai-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: